name: Deploy MkDocs to GitHub Pages

on:
  push:
    branches:
      - master # 如果您的主分支是 master，请改为 master

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install mkdocs-material
      - run: mkdocs gh-deploy --force